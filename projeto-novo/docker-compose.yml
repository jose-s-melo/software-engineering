services:
  db:
    image: postgres:16
    container_name: postgres_database_container
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: barbearia-front
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  api:
    build: ./backend/core/
    container_name: api_container
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  postgres_data:

