# ==============================================================
# CONFIGURAÇÕES DE TESTE (Sobrescreve o application.properties principal)
# ==============================================================

# 1. Troca o PostgreSQL pelo H2 (Banco em Memória)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 2. Configurações Falsas de E-mail para os Testes
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# 3. Garante que a Porta do Servidor não dê conflito
server.port=0

# 4. Configurações Falsas do JWT para o TokenService não quebrar a injeção
api.security.token.secret=chave_secreta_falsa_para_testes_1234567890_jwt
api.security.issuer=core-test